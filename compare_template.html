<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Σύγκριση εκλογών</title>
<!--META-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha256-tXCrvaljxgtN5LT/Syb5Mm9T+yzPFGH98JVcoJT7JTk=" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha256-XJrs/DDkVkUZ29zdzFOkGCJ9zHVo5hnpdi3c7HYJ7Uc=" crossorigin="anonymous"></script>
<!--FONTS-->
<script>/*THEME_JS*/</script>
<style>
/*THEME_TOKENS*/
/*SITE_CSS*/
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh}
body{background:var(--paper);color:var(--ink);font:.875rem/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-rows:auto auto 1fr auto auto}
:root{accent-color:var(--pen)}
.head{padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.bar{margin:0;padding:8px 16px 0}
.site{margin:0;padding:6px 16px 8px}
h1{font-size:1.0625rem;margin:0 0 2px}
.sub{color:var(--ink-2);font-size:.78125rem;margin:0}
.note{color:var(--ink-2);font-size:.71875rem;line-height:1.35;margin:2px 0 0}
.ctl{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:8px}
.ctl label{display:flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--ink-2)}
select{font:inherit;font-size:.875rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
#map{min-height:220px}
.legend{background:color-mix(in srgb,var(--panel) 82%,transparent);-webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%);color:var(--ink);padding:8px 10px;border-radius:8px;font-size:.75rem;line-height:1.3;box-shadow:0 1px 4px var(--shadow)}
@media (prefers-reduced-transparency:reduce){.legend{background:var(--panel);backdrop-filter:none;-webkit-backdrop-filter:none}}
.legend b{display:block;margin-bottom:4px}
.legend,.t{overflow-wrap:anywhere}
.legend i{display:inline-block;width:14px;height:12px;margin-right:6px;vertical-align:-2px;border:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ctl .find{position:relative;flex-wrap:wrap}
.ctl input{font:inherit;font-size:.875rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:14em;max-width:100%}
.hits{position:absolute;left:0;right:0;top:100%;z-index:1000;margin:2px 0 0;padding:4px;list-style:none;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 8px var(--shadow);max-height:50vh;max-height:50svh;overflow:auto}
.hits[hidden]{display:none}
.hits button,#ext button{all:unset;display:block;box-sizing:border-box;width:100%;padding:6px 8px;cursor:pointer;color:var(--ink)}
.hits button:hover,#ext button:hover{background:var(--wash)}
.hits button:focus-visible,#ext button:focus-visible,#ext summary:focus-visible{outline:2px solid var(--pen);outline-offset:-2px}
.hits .m,#ext .m{color:var(--ink-2);font-size:.75rem}
#ext{border-top:1px solid var(--line);padding:0 16px}
#ext summary{cursor:pointer;display:flex;align-items:center;min-height:36px;color:var(--ink-2)}
#ext .lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 24px;max-height:40vh;max-height:40svh;overflow:auto;padding-bottom:8px}
#ext h2{font-size:.8125rem;margin:8px 0 2px}
#ext ol{margin:0;padding:0;list-style:none}
#ext li{display:flex;justify-content:space-between;gap:8px}
#ext li b{font-variant-numeric:tabular-nums;white-space:nowrap;padding:6px 8px 6px 0}
#ext li button{flex:1}
.hits button,#ext button,select{transition:transform 100ms ease-out}
.hits button:active,#ext button:active,select:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){.hits button,#ext button,select{transition:none}.hits button:active,#ext button:active,select:active{transform:none}}
@media (pointer:coarse){.hits button,#ext li button{min-height:44px;display:flex;align-items:center;flex-wrap:wrap;gap:0 6px}#ext summary{min-height:44px}.ctl input{min-height:44px;font-size:1rem}}
.leaflet-tooltip.t{font:.78125rem/1.4 system-ui,sans-serif}
.t b{font-size:.8125rem}
.leaflet-tooltip.t{background:var(--panel);color:var(--ink);border-color:var(--line);box-shadow:0 1px 4px var(--shadow)}
.leaflet-tooltip.t::before{display:none}
.t .m{color:var(--ink-2)}
.t td{padding:0 4px}
@media (max-width:600px){
  #map{min-height:360px;min-height:max(360px,55svh)}  /* the map keeps over half the screen; the rest scrolls below it */
  h1{font-size:.9375rem}
  .sub{font-size:.75rem}
  .ctl label{flex:1 1 0;min-width:0}  /* Κόμμα and Προβολή share a row; their text stays for screen readers */
  .ctl .lt{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .ctl select,.ctl input{flex:1;min-width:0;width:auto}
  .ctl .find{flex:1 1 100%}
  .legend{font-size:.75rem;padding:6px 8px}
  .legend i{width:11px;height:10px;margin-right:4px}
  .site{padding:2px 16px 0;font-size:.75rem;line-height:1.3}  /* map gets the height; links keep their touch padding */
  .site p{margin:0}
}
</style>
</head>
<body>
<!--HEADER-->
<header class="head">
  <h1>Σύγκριση εκλογών ανά κοινότητα</h1>
  <div class="ctl">
    <label><span class="lt">Κόμμα</span> <select id="party"></select></label>
    <label><span class="lt">Προβολή</span> <select id="view"></select></label>
    <div class="find"><label>Αναζήτηση <input id="q" type="search" placeholder="π.χ. Πάτρα" autocomplete="off" enterkeyhint="search" spellcheck="false" aria-controls="hits" aria-label="Αναζήτηση περιοχής"></label>
      <ul id="hits" class="hits" hidden></ul></div>
  </div>
  <p class="sub" id="sub" aria-live="polite"></p>
  <p class="sr" id="hitsN" role="status"></p>
  <p class="note" id="note"></p>
</header>
<div id="map" role="region" aria-label="Χάρτης"></div>
<details id="ext"><summary>Οι 10 υψηλότερες και οι 10 χαμηλότερες περιοχές</summary><div class="lists" id="lists"></div></details>
<!--FOOTER-->
<script>/*SHARED_JS*/</script>
<script>
const D = /*DATA*/null;
const E = Object.keys(D.elections);  // chronological
// change views: every ordered pair (older -> newer)
const VIEWS = {};
for (const e of E) VIEWS[e] = {label: D.elections[e]};
for (let i = 0; i < E.length; i++) for (let j = i + 1; j < E.length; j++)
  VIEWS[`${E[i]}~${E[j]}`] = {from: E[i], to: E[j], label: `Μεταβολή ${D.elections[E[i]]} → ${D.elections[E[j]]}`};
const COLORS = ["#f3eef8", "#e0d3ec", "#cbb5de", "#b497cf", "#9c78bf", "#845bae", "#6b3f9a", "#532a82", "#3a1866"];
const DCOLORS = ["#b35806", "#e08214", "#fdb863", "#fee0b6", "#f2f0ee", "#d8daeb", "#b2abd2", "#8073ac", "#542788"];
const EURO_NOTE = "Οι ευρωεκλογές είχαν πολύ χαμηλότερη συμμετοχή και ενιαία εθνική λίστα· ανεβάζουν τα ποσοστά των μικρότερων κομμάτων. ";
const NOTE = "Ανεπίσημα αποτελέσματα ΥΠΕΣ, κανονικά τμήματα· διαμερίσματα που δεν αντιστοιχίστηκαν σε κοινότητα ΕΛΣΤΑΤ λείπουν. Αχνό: λιγότερα από 50 έγκυρα.";

const fmt = n => n.toLocaleString("el-GR");
const num = (x, d = 1) => x.toLocaleString("el-GR", {minimumFractionDigits: d, maximumFractionDigits: d});
const pctf = p => num(p) + "%";
const signed = (d, digits = 1) => (d > 0 ? "+" : d < 0 ? "−" : "±") + num(Math.abs(d), digits);
const bin = (p, bins, colors) => { let i = 0; while (i + 1 < bins.length && p >= bins[i + 1]) i++; return colors[i]; };
// round a positive step to 1, 2, 2.5 or 5 x 10^k
const nice = x => { const p = 10 ** Math.floor(Math.log10(x)), m = x / p; return p * (m < 1.5 ? 1 : m < 2.25 ? 2 : m < 3.5 ? 2.5 : m < 7.5 ? 5 : 10); };

let pi = 0, view = "2023-june", bins = [], colors = COLORS;
// share of party index pi in election e for row r = [valid, votes...]; null when the party did not run or no votes
const share = (r, e) => { const v = r && r[e]; return v && v[0] && v[pi + 1] !== null ? 100 * v[pi + 1] / v[0] : null; };
const valueOf = f => {
  const V = VIEWS[view], r = f.properties.e;
  if (!V.from) return share(r, view);
  const a = share(r, V.from), b = share(r, V.to);
  return a === null || b === null ? null : b - a;
};
const thin = f => {
  const V = VIEWS[view], r = f.properties.e;
  return Math.min(...(V.from ? [V.from, V.to] : [view]).map(e => r[e] ? r[e][0] : 0)) < 50;
};

function makeBins() {
  const vals = [];
  layer.eachLayer(l => { if (!thin(l.feature)) { const v = valueOf(l.feature); if (v !== null) vals.push(v); } });
  vals.sort((a, b) => a - b);
  const q = t => vals.length ? vals[Math.min(vals.length - 1, Math.floor(t * vals.length))] : 0;
  if (VIEWS[view].from) {  // symmetric diverging bins around 0, step from the spread of changes
    const s = nice(Math.max(0.1, Math.max(Math.abs(q(0.05)), Math.abs(q(0.95))) / 3));
    bins = [-Infinity, -3 * s, -2 * s, -s, -s / 4, s / 4, s, 2 * s, 3 * s]; colors = DCOLORS;
  } else {  // sequential: rounded ninths of the distribution
    const step = nice(Math.max(0.1, (q(0.97) - q(0.03)) / 8));
    const lo = Math.max(0, Math.floor(q(0.03) / step) * step);
    bins = [0, ...Array.from({length: 8}, (_, i) => lo + (i + 1) * step)]; colors = COLORS;
  }
}

function style(f) {
  const v = valueOf(f);
  if (v === null) return {weight: 0.3, color: "#888", fillColor: "#ccc", fillOpacity: 0.25};
  return {weight: 0.3, color: "#5553", fillColor: bin(v, bins, colors), fillOpacity: thin(f) ? 0.45 : 0.85};
}

function tip(f) {
  const a = f.properties, r = a.e, V = VIEWS[view];
  const rows = E.map(e => {
    const p = share(r, e), on = e === view || e === V.from || e === V.to ? "font-weight:600" : "";
    if (p === null) return `<tr style="${on}"><td>${D.elections[e]}</td><td colspan=2>${r[e] && r[e][pi + 1] === null ? "δεν κατέβηκε" : "—"}</td></tr>`;
    return `<tr style="${on}"><td>${D.elections[e]}</td><td style="text-align:right">${pctf(p)}</td>` +
           `<td class="m" style="text-align:right">${fmt(r[e][pi + 1])}/${fmt(r[e][0])}</td></tr>`;
  }).join("");
  let d = "";
  if (V.from) {
    const p0 = share(r, V.from), p1 = share(r, V.to);
    if (p0 !== null && p1 !== null)
      d = `<tr style="font-weight:600"><td>Μεταβολή</td><td style="text-align:right">${signed(p1 - p0)} μον.</td>` +
          `<td class="m" style="text-align:right">${signed(r[V.to][pi + 1] - r[V.from][pi + 1], 0)} ψήφοι</td></tr>`;
  }
  return `<b>${a.n}</b><div class="m">${a.u} · ${a.ep}</div><div class="m">${D.parties[pi].name}</div><table>${rows}${d}</table>`;
}

const map = L.map("map", mapOptions({preferCanvas: true})).setView([38.6, 23.8], 6.5);
map.attributionControl.addAttribution("Όρια: ΕΛΣΤΑΤ 2021 · Αποτελέσματα: ΥΠΕΣ (ανεπίσημα)");  // no base map: the choropleth is the only colour
const layer = L.geoJSON(D.geo, {style: () => ({}), onEachFeature: (f, l) => {
  l.bindTooltip(() => tip(f), {sticky: true, className: "t"});
  l.on("click", () => l.openTooltip());
}}).addTo(map);
const legend = L.control({position: "bottomright"});
legend.onAdd = () => L.DomUtil.create("div", "legend");
legend.addTo(map);

function drawLegend() {
  const delta = Boolean(VIEWS[view].from);
  legend.getContainer().innerHTML = `<b>${delta ? "Μεταβολή (μονάδες)" : "% εγκύρων"}</b>` + bins.map((b, i) => {
    const dig = x => (x * 10) % 1 ? 2 : x % 1 ? 1 : 0;
    const hi = bins[i + 1], f = x => delta ? signed(x, dig(x)) : num(x, dig(x));
    const label = b === -Infinity ? `κάτω από ${f(hi)}` : hi === undefined ? `${f(b)} και πάνω` : `${f(b)} έως ${f(hi)}`;
    return `<div><i style="background:${colors[i]}"></i>${label}</div>`;
  }).join("");
}

// Search and the extremes list reach every area by keyboard: canvas paths cannot take focus.
const AREAS = [];  // built once: the folded words of each area's name, then of its unit and constituency
const words = s => fold(s).split(/[^\p{L}\d]+/u).filter(Boolean).map(w => [w, key(w)]);
layer.eachLayer(l => { const p = l.feature.properties; AREAS.push({l, name: words(p.n), rest: words(`${p.u} ${p.ep}`)}); });
const hitsEl = document.getElementById("hits"), qEl = document.getElementById("q"), hitsN = document.getElementById("hitsN");
const areaBtn = (i, extra) => `<button type="button" data-i="${i}">${AREAS[i].l.feature.properties.n}` +
  ` <span class="m">${AREAS[i].l.feature.properties.u}, ${AREAS[i].l.feature.properties.ep}</span>${extra || ""}</button>`;
function pick(i) {
  const l = AREAS[i].l;
  if (MOTION) map.flyToBounds(l.getBounds(), {maxZoom: 11, duration: .6});
  else map.fitBounds(l.getBounds(), {maxZoom: 11, animate: false});
  l.openTooltip();
}
let found = [];
function search() {
  const qs = queryWords(qEl.value);
  const ks = qs.map(key);  // per query, not per area
  found = [];
  if (qs.length) AREAS.forEach((a, i) => {
    if (qs.every((q, j) => hitsK(a.name, q, ks[j]) || hitsK(a.rest, q, ks[j])))
      found.push([qs.every((q, j) => hitsK(a.name, q, ks[j])) ? 0 : 1, i]);  // a town-name match ranks above a unit match
  });
  found.sort((x, y) => x[0] - y[0] || x[1] - y[1]);
  hitsEl.hidden = !found.length;
  hitsEl.innerHTML = found.slice(0, 8).map(([, i]) => `<li>${areaBtn(i)}</li>`).join("");
  hitsN.textContent = !qs.length ? "" : !found.length ? "Καμία περιοχή." : `${found.length} περιοχές${found.length > 8 ? ", εμφανίζονται οι 8 πρώτες" : ""}.`;
}
qEl.addEventListener("input", search);
qEl.addEventListener("keydown", e => {
  if (e.key === "Escape") { qEl.value = ""; search(); }
  else if (e.key === "Enter" && found.length === 1) pick(found[0][1]);
  else if (e.key === "ArrowDown" && !hitsEl.hidden) { e.preventDefault(); hitsEl.querySelector("button").focus(); }
});
hitsEl.addEventListener("keydown", e => {
  const bs = [...hitsEl.querySelectorAll("button")], i = bs.indexOf(document.activeElement);
  if (e.key === "ArrowDown" && bs[i + 1]) { e.preventDefault(); bs[i + 1].focus(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); (bs[i - 1] || qEl).focus(); }
  else if (e.key === "Escape") { qEl.value = ""; search(); qEl.focus(); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-i]");
  if (b) { pick(+b.dataset.i); if (hitsEl.contains(b)) { hitsEl.hidden = true; } }
  else if (!e.target.closest(".find")) hitsEl.hidden = true;
});
qEl.addEventListener("focus", () => { hitsEl.hidden = !found.length; });

// Highest and lowest areas of the current view, without areas under the 50-valid-votes threshold.
const extremes = (rows, n) => { const s = rows.slice().sort((a, b) => b[1] - a[1]); return [s.slice(0, n), s.slice(-n).reverse()]; };
function drawExtremes() {
  const rows = AREAS.map((a, i) => [i, valueOf(a.l.feature)]).filter(([i, v]) => v !== null && !thin(AREAS[i].l.feature));
  const delta = Boolean(VIEWS[view].from), show = v => delta ? signed(v) + " μον." : pctf(v);
  const list = (title, rs) => `<div><h2>${title}</h2><ol>` + rs.map(([i, v]) => `<li>${areaBtn(i)}<b>${show(v)}</b></li>`).join("") + `</ol></div>`;
  const [hi, lo] = extremes(rows, 10);
  document.getElementById("lists").innerHTML = rows.length ? list(delta ? "Μεγαλύτερη αύξηση" : "Υψηλότερα ποσοστά", hi) +
    list(delta ? "Μεγαλύτερη μείωση" : "Χαμηλότερα ποσοστά", lo) : "<p class=m>Καμία περιοχή με αρκετά έγκυρα.</p>";
}

function total(e) { const t = D.totals[e]; return t[pi + 1] === null ? null : [t[pi + 1], t[0]]; }
function render() {
  const V = VIEWS[view], name = D.parties[pi].name;
  makeBins();
  layer.setStyle(style);
  drawLegend();
  drawExtremes();
  const sub = document.getElementById("sub");
  if (V.from) {
    const a = total(V.from), b = total(V.to);
    sub.textContent = !a || !b ? `${name}: δεν κατέβηκε ${!a ? "το " + D.elections[V.from] : "το " + D.elections[V.to]}, δεν υπάρχει σύγκριση.`
      : `${name}, ${D.elections[V.from]} → ${D.elections[V.to]}: ${pctf(100 * a[0] / a[1])} → ${pctf(100 * b[0] / b[1])} ` +
        `(${signed(100 * b[0] / b[1] - 100 * a[0] / a[1])} μονάδες, ${signed(b[0] - a[0], 0)} ψήφοι) στις περιοχές του χάρτη.`;
  } else {
    const t = total(view);
    sub.textContent = t ? `${name}, ${D.elections[view]}: ${pctf(100 * t[0] / t[1])} (${fmt(t[0])} ψήφοι) στις περιοχές του χάρτη.`
      : `${name}: δεν κατέβηκε στις εκλογές: ${D.elections[view]}.`;
  }
  const euro = [view, V.from, V.to].includes("2024-euro");
  document.getElementById("note").textContent =
    (V.from ? "Χρώμα = διαφορά ποσοστού σε ποσοστιαίες μονάδες· η μεταβολή δεν δείχνει από πού ήρθαν οι ψηφοφόροι. " : "") +
    (euro && V.from ? EURO_NOTE : "") + NOTE;
  try { history.replaceState(null, "", `#party=${D.parties[pi].id}&view=${view}`); } catch { /* sandboxed srcdoc viewers forbid history calls: the page works, only the link does not follow */ }
}

const partySel = document.getElementById("party"), viewSel = document.getElementById("view");
D.parties.forEach((p, i) => partySel.add(new Option(p.name, i)));
const og = (label, keys) => { const g = document.createElement("optgroup"); g.label = label;
  keys.forEach(k => g.append(new Option(VIEWS[k].label.replace("Μεταβολή ", ""), k))); viewSel.append(g); };
og("Ποσοστό", E);
og("Μεταβολή", Object.keys(VIEWS).filter(k => VIEWS[k].from));
const h = new URLSearchParams(location.hash.slice(1));
const hp = D.parties.findIndex(p => p.id === h.get("party"));
if (hp >= 0) pi = hp;
if (VIEWS[h.get("view")]) view = h.get("view");
partySel.value = pi; viewSel.value = view;
partySel.onchange = () => { pi = +partySel.value; render(); };
viewSel.onchange = () => { view = viewSel.value; render(); };
render();
// Pages opened in hidden panes lay out at 0x0, and map.getSize() caches that size: fit once the container
// has a real width (hidden pages may skip ResizeObserver callbacks, hence also visibilitychange).
let fitted = false;
const fitOnce = () => {
  if (fitted || !map.getContainer().clientWidth) return;
  fitted = true;
  map.invalidateSize({animate: false});
  // Fit to the bulk of the areas: Kastellorizo and Gavdos would add a lot of sea, Turkey and the Balkans.
  const quant = (a, p) => a[Math.min(a.length - 1, Math.floor(p * a.length))];
  const lats = [], lngs = [];
  layer.eachLayer(l => { const c = l.getBounds().getCenter(); lats.push(c.lat); lngs.push(c.lng); });
  lats.sort((a, b) => a - b); lngs.sort((a, b) => a - b);
  map.fitBounds([[quant(lats, 0.005), quant(lngs, 0.005)], [quant(lats, 0.995), quant(lngs, 0.995)]], {animate: false, padding: [4, 4]});
  map.setMinZoom(map.getZoom() - 0.5);
  const all = layer.getBounds();  // panning stays on Greece, with half a degree of margin
  map.setMaxBounds([[all.getSouth() - 0.5, all.getWest() - 0.5], [all.getNorth() + 0.5, all.getEast() + 0.5]]);
  map.options.maxBoundsViscosity = 0.8;
};
new ResizeObserver(fitOnce).observe(map.getContainer());
document.addEventListener("visibilitychange", fitOnce);
fitOnce();
</script>
</body>
</html>
