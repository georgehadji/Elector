# Every second day: fetch the Majorline Greek forecast (analysis/majorline_fetch.py) and open a PR if it changed.
# Nothing goes to main without a human merging the PR. A PR opened with GITHUB_TOKEN does not start CI, so the tests
# run here. Needs repo setting Actions > General > "Allow GitHub Actions to create and approve pull requests";
# without it the branch is pushed and the job fails at the PR step.
name: majorline-fetch
on:
  schedule:
    - cron: "23 6 */2 * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: majorline
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install xlrd==2.0.1
      # No ETag cache here: without it a run is one 34 KB download, and the upsert gives no diff if nothing is new.
      - run: python -I -X utf8 analysis/majorline_fetch.py
      - run: python -I -X utf8 -m unittest discover -s tests
      - name: Open a PR if the CSVs changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- 'analysis/majorline_*.csv')" ]; then echo "no new estimate"; exit 0; fi
          b="bot/majorline-$(date -u +%F)"
          git switch -c "$b"
          git add analysis/majorline_*.csv
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Majorline: νέα εκτίμηση"
          git push --force origin "$b"
          gh pr create --base main --head "$b" --title "Majorline: νέα εκτίμηση $(date -u +%F)" \
            --body "Αυτόματο: analysis/majorline_fetch.py. Τα τεστ πέρασαν στο job του workflow."
