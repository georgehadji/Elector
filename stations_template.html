<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/*THEME_JS*/</script>
<title>Χάρτης ανά τμήμα</title>
<!--META-->
<!--FONTS-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha256-tXCrvaljxgtN5LT/Syb5Mm9T+yzPFGH98JVcoJT7JTk=" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha256-XJrs/DDkVkUZ29zdzFOkGCJ9zHVo5hnpdi3c7HYJ7Uc=" crossorigin="anonymous"></script>
<style>
/*COMMON_CSS*/
  #map { height: 66vh; height: 66svh; min-height: 380px; }
  body.printing #map { width: 186mm; height: 130mm; min-height: 0; }
  @media print {
    #map { width: 186mm; height: 130mm; min-height: 0; }
    #detail { display: block; break-before: page; }
    #tbl { font-size: 9pt; line-height: 1.3; }
    #tbl th, #tbl td { padding: 3px 6px; }
  }
  /* Per-station detail: print/PDF only (1,000+ rows; the screen has the panel and the CSV). */
  @media screen { #detail { display: none; } }
  #detail table { font-size: 8.5pt; line-height: 1.25; }
  #detail th, #detail td { padding: 2px 4px; }
  #detail thead { display: table-header-group; }  /* repeat header on every page */
</style>
</head>
<body>
<main>
<!--HEADER-->
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <nav class="views" id="views" aria-label="Άλλοι χάρτες"></nav>
  <div class="controls">
    <div class="seg" role="group" aria-label="Χρώμα">
      <button type="button" data-m="share" aria-pressed="true">% ψήφων κόμματος</button>
      <button type="button" data-m="dev" aria-pressed="false">Απόκλιση από μέσο όρο</button>
      <button type="button" data-m="votes" aria-pressed="false">Σταυροί</button>
    </div>
    <button class="pdf" type="button">Εξαγωγή PDF</button>
  </div>
  <div class="mapwrap">
    <div id="map" role="region" aria-label="Χάρτης ανά εκλογικό κατάστημα"></div>
    <div class="hint" id="hint" aria-hidden="true">Χρησιμοποιήστε δύο δάχτυλα για να μετακινήσετε τον χάρτη</div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="legend" id="legend"></div>
  <h2>Ανά εκλογικό κατάστημα</h2>
  <div class="tablewrap" role="region" aria-label="Πίνακας εκλογικών καταστημάτων" tabindex="0"><table id="tbl" aria-label="Πίνακας εκλογικών καταστημάτων"></table></div>
  <p class="note" id="note"></p>
  <section id="detail">
    <h2>Αναλυτικά ανά εκλογικό τμήμα</h2>
    <table id="dtbl" aria-label="Αναλυτικά ανά εκλογικό τμήμα"></table>
  </section>
<!--FOOTER-->
</main>
<script>/*SHARED_JS*/</script>
<script>
const D = /*DATA*/null;
/*COMMON_JS*/
let metric = "share";

// Each venue: st = [[station no, Ε.Δ., party votes, crosses, rank in party], ...]
// Venue text is "NAME  STREET  TOWN"; some names contain a double space themselves.
[...D.venues, ...D.missing].forEach(v => {
  v.pv = v.st.reduce((s, x) => s + x[2], 0);
  v.cv = v.st.reduce((s, x) => s + x[3], 0);
  const p = v.venue.split(/\s{2,}/).reduce((a, s) => (/^\d+[Α-Ω]?$/.test(s) && a.length ? a[a.length - 1] += " " + s : a.push(s), a), []);
  [v.name, v.street, v.town] = p.length > 3 ? [p.slice(0, -2).join(" "), ...p.slice(-2)] : p;
});
// Labels differ by mode: a candidate's crosses over party votes, or a party's votes over valid votes.
const T = D.labels;
$("title").textContent = T.title;
$("sub").textContent =
  `${T.num} ανά εκλογικό τμήμα, ${T.scope}, ${D.election_title}. Κάθε κύκλος είναι ένα εκλογικό κατάστημα.`;
document.querySelector('[data-m="share"]').textContent = T.share;
document.querySelector('[data-m="votes"]').textContent = T.num;

const all = [...D.venues, ...D.missing];  // index in `all` = table data-i; the first D.venues.length are on the map
const totC = all.reduce((s, v) => s + v.cv, 0), totP = all.reduce((s, v) => s + v.pv, 0);
const mean = totP ? totC / totP : 0;
const nSt = all.reduce((s, v) => s + v.st.length, 0);
const first = all.reduce((s, v) => s + v.st.filter(x => x[4] === 1 && x[3] > 0).length, 0);
const best = all.flatMap(v => v.st).filter(x => x[2] >= 50).sort((a, b) => b[3] / b[2] - a[3] / a[2])[0];
$("stats").innerHTML =
  `<div><b>${fmt(totC)}</b><span>${T.num} σε ${fmt(nSt)} τμήματα</span></div>` +
  `<div><b>${pct(mean)}</b><span>${T.of} (μέσος όρος)</span></div>` +
  (D.mode === "party"
    ? `<div><b>${best ? pct(best[3] / best[2]) : "–"}</b><span>καλύτερο τμήμα${best ? ` (Τμ. ${best[0]}, ${best[1].replace(/^\d*\s*Ε\.Δ\.\s*/, "")})` : ""}</span></div>`
    : `<div><b>${fmt(first)}</b><span>τμήματα όπου βγήκε 1ος στο κόμμα</span></div>`) +
  `<div><b>${D.venues.length} / ${all.length}</b><span>καταστήματα στον χάρτη</span></div>`;

const map = L.map("map", mapOptions({scrollWheelZoom: false}));  // fractional fit: whole zoom levels leave a small constituency at ~half the map
const tiles = baseTiles(map, "Καταστήματα & αποτελέσματα: ΥΠΕΣ (ανεπίσημα)", 19);
touchMap(map);

const share = v => v.pv ? v.cv / v.pv : 0;
const value = v => metric === "votes" ? v.cv : metric === "dev" ? (mean ? share(v) / mean : 0) : share(v);
// Small circles at the fitted zoom (dense city centres), growing as the user zooms in.
// Patras, 375px: overlapping pairs at the fitted zoom 294 -> 136 vs the old fixed 4 + 14·√ size.
const maxC = Math.max(1, ...D.venues.map(v => v.cv));
let z0;
const radius = v => (2.5 + 8 * Math.sqrt(v.cv / maxC)) * Math.min(1.6, Math.max(0.7, 2 ** ((map.getZoom() - (z0 ?? map.getZoom())) / 3)));  // before the first fit: scale 1
map.on("zoomend", () => z0 != null && layer.eachLayer(l => l.setRadius(radius(l.v))));
function tip(v) {
  const approx = !["street", "name"].includes(v.how) ? `<br><span class="m">Θέση κατά προσέγγιση (βάσει οδού)</span>` : "";
  return `<div class="tip"><b>${v.name}</b><span class="m">${v.street || ""} · ${v.den}</span>${approx}<br>` +
    `${T.num} <b style="display:inline">${fmt(v.cv)}</b> / ${T.den} ${fmt(v.pv)} · ${pct(share(v))}` +
    (v.pv && mean ? ` (${devFmt(share(v) / mean)} από τον μέσο όρο)` : "") +
    `<table>${v.st.map(x => `<tr><td>Τμ. ${x[0]}</td><td>${fmt(x[3])} / ${fmt(x[2])}</td><td>${pct(x[2] ? x[3] / x[2] : 0)}</td>` +
      `<td>${x[4]}${T.ord}</td>${x[5] ? `<td>${x[5]}</td>` : ""}</tr>`).join("")}</table></div>`;
}

let layer;
function render() {
  const br = breaks(D.venues.map(value));
  const fill = v => metric === "dev" ? (v.pv ? devColor(value(v)) : css("--d0")) : colorFor(value(v), br);
  if (layer) layer.remove();
  layers = [];
  const ms = D.venues.map((v, i) => {
    const l = L.circleMarker([v.lat, v.lon], {radius: z0 == null ? 3 : radius(v), fillColor: fill(v), fillOpacity: 0.75,
                                              color: css("--surface"), weight: 1});
    l.v = v; l.i = i; layers[i] = l; bindFeature(l, tip(v));
    return l;
  });
  // Largest on the bottom so small venues stay clickable.
  layer = L.featureGroup(ms.sort((a, b) => b.v.cv - a.v.cv)).addTo(map);
  if (!render.fitted) {
    render.fitted = true;
    fitOnceSized(map, () => layer.getBounds(), {padding: [12, 12]},
                 () => { z0 = map.getZoom(); layer.eachLayer(l => l.setRadius(radius(l.v))); });
  }

  const show = x => metric === "share" ? pct(x) : fmt(Math.round(x));
  $("legend").innerHTML = (metric === "dev" ? devLegend()
    : `<span class="lbl" style="margin-left:0">Χρώμα:</span>` + seqLegend(br, show)) +
    `<span class="lbl">· μέγεθος κύκλου = ${T.num}</span>`;

  const tbl = $("tbl");
  tbl.innerHTML =
    `<thead><tr><th scope="col">Κατάστημα</th><th scope="col">Δημ. ενότητα</th><th scope="col">Τμήματα</th><th scope="col" class="n">${T.num}</th><th scope="col" class="n">${T.den}</th>` +
    `<th scope="col" class="n">%</th><th scope="col" class="n">Απόκλιση</th></tr></thead><tbody>` +
    all.map((v, i) => {
      const r = mean ? share(v) / mean : 0;
      return `<tr data-i="${i}"><td>${v.lat ? `<button type="button" class="rowlink" data-i="${i}">${v.name}</button>` : `${v.name} <span class="m">(εκτός χάρτη)</span>`}</td>` +
        `<td>${v.den}</td><td>${v.st.map(x => x[0]).join(", ")}</td><td class="n" data-v="${v.cv}">${fmt(v.cv)}</td>` +
        `<td class="n" data-v="${v.pv}">${fmt(v.pv)}</td><td class="n" data-v="${share(v)}">${pct(share(v))}</td>` +
        `<td class="n" data-v="${v.pv ? r : -1}">${v.pv && mean ? devFmt(r) : "–"}</td></tr>`;
    }).join("") + `</tbody>`;
  sortable(tbl, metric === "votes" ? 3 : 5, "descending");
  repick();
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  metric = b.dataset.m;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  $("tbl")._sort = null;
  render();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
addEventListener("themechange", render);
const exportPdf = printSetup(map, tiles, () => layer.getBounds(),
  () => `${T.title} ανά τμήμα - ${T.scope} - ${D.election.replace("/", "-")}`);
document.querySelector(".pdf").addEventListener("click", exportPdf);  // no inline handlers: the page's CSP forbids them

$("note").textContent =
  `Πηγές: ανεπίσημα αποτελέσματα ΥΠΕΣ ανά εκλογικό τμήμα· καταστήματα ψηφοφορίας από το αρχείο ΥΠΕΣ «Εκλογικά τμήματα με κατάστημα ψηφοφορίας» (20.5.2023)· ` +
  `θέσεις καταστημάτων με γεωκωδικοποίηση OpenStreetMap/Nominatim, ελεγμένες ότι πέφτουν στη σωστή δημοτική ενότητα. ` +
  `Απόκλιση: % του καταστήματος προς τον μέσο όρο. ` +
  `Εκτός χάρτη: τμήματα ετεροδημοτών και ειδικά τμήματα` +
  (D.missing.length ? `, και ${D.missing.length} καταστήματα χωρίς θέση (στον πίνακα).` : ".");

// Per-station table for the PDF, by station number; independent of the colour metric.
$("dtbl").innerHTML =
  `<thead><tr><th scope="col">Τμ.</th><th scope="col">Εκλ. διαμέρισμα</th><th scope="col">Κατάστημα</th>` +
  `<th scope="col" class="n">${T.num}</th><th scope="col" class="n">${T.den}</th><th scope="col" class="n">%</th><th scope="col" class="n">${T.rank}</th>` +
  (D.mode === "party" ? `<th>Πρώτος σε σταυρούς</th>` : "") + `</tr></thead><tbody>` +
  all.flatMap(v => v.st.map(x => ({x, v}))).sort((a, b) => a.x[0] - b.x[0]).map(({x, v}) =>
    `<tr><td>${x[0]}</td><td>${x[1].replace(/^\d*\s*Ε\.Δ\.\s*/, "")}</td><td>${v.name}</td>` +
    `<td class="n">${fmt(x[3])}</td><td class="n">${fmt(x[2])}</td><td class="n">${pct(x[2] ? x[3] / x[2] : 0)}</td>` +
    `<td class="n">${x[3] ? x[4] : "–"}</td>` + (D.mode === "party" ? `<td>${x[5] || "–"}</td>` : "") + `</tr>`).join("") + `</tbody>`;
render();
</script>
</body>
</html>
