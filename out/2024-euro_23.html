<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Χάρτης σταυρών</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600&family=GFS+Didot&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Shared by template.html (areas) and stations_template.html (polling venues); inlined at build time. */
:root {
  color-scheme: light;
  --surface: #fcfcfb; --ink: #1d1d1b; --ink-2: #5c5b57; --line: #e4e3df; --chip: #f2f1ee; --shadow: rgba(0,0,0,.18);
  --s0: #eef4fc; --s1: #cde2fb; --s2: #9ec5f4; --s3: #6da7ec; --s4: #3987e5; --s5: #256abf; --s6: #104281;
  /* diverging: below the average (red), near it (gray), above it (blue) */
  --link: #256abf;
  --d-3: #a8302e; --d-2: #e0736b; --d-1: #f6c4c0; --d0: #e4e3df; --d1: #9ec5f4; --d2: #3987e5; --d3: #104281;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --surface: #1a1a19; --ink: #ecebe7; --ink-2: #a8a7a2; --line: #383835; --chip: #262624;
          --shadow: rgba(0,0,0,.5); --d0: #5a5955; --link: #6da7ec; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 "Fira Sans", system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--surface); color: var(--ink); }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
h1 { font: 400 28px/1.15 "GFS Didot", Georgia, serif; margin: 0 0 4px; }
.views a[href="index.html"] { font-weight: 600; }
h2 { font-size: 16px; margin: 0 0 8px; }
a { color: var(--link); }
.sub { color: var(--ink-2); margin: 0 0 8px; }
.views { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 12px; font-size: 14px; }
.views:empty { display: none; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.controls label { color: var(--ink-2); font-size: 13px; }
select, button, input { font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
select { min-width: 0; max-width: 100%; }
input[type="search"] { width: 14em; max-width: 100%; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--s4); outline-offset: 2px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.pdf { margin-left: auto; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 24px; margin: 4px 0 12px; }
.stats b { display: block; font-size: 20px; line-height: 1.3; font-variant-numeric: tabular-nums; }
.stats span { color: var(--ink-2); font-size: 12px; }
.mapwrap { position: relative; }
#map { height: 62vh; min-height: 360px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); }
.hint { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; z-index: 1000;
        background: rgba(0,0,0,.5); color: #fff; font-weight: 600; border-radius: 8px; pointer-events: none;
        opacity: 0; transition: opacity .2s; }
.hint.on { opacity: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; margin: 8px 0 20px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 30px; height: 10px; border-radius: 2px; }
.legend .lbl { margin: 0 8px 0 4px; font-variant-numeric: tabular-nums; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
th button { all: unset; cursor: pointer; }
th button:focus-visible { outline: 2px solid var(--s4); outline-offset: 2px; }
th[aria-sort="ascending"] button::after { content: " ▲"; font-size: 9px; }
th[aria-sort="descending"] button::after { content: " ▼"; font-size: 9px; }
td.n, th.n { text-align: right; }
tbody tr:hover { background: var(--chip); }
tr.sel { background: var(--chip); box-shadow: inset 3px 0 0 var(--s4); }
.rowlink { all: unset; cursor: pointer; text-decoration: underline; text-decoration-color: var(--ink-2); text-underline-offset: 3px; }
.rowlink:focus-visible { outline: 2px solid var(--s4); outline-offset: 2px; }
.m { color: var(--ink-2); }
.tablewrap { max-height: 520px; overflow: auto; }
.note { color: var(--ink-2); font-size: 12px; margin-top: 16px; }
/* Tooltip (mouse hover) and details panel (tap, click, table row) */
.leaflet-container .leaflet-tooltip { background: var(--surface); color: var(--ink); border-color: var(--line); box-shadow: 0 2px 8px var(--shadow); }
.leaflet-tooltip-left::before { border-left-color: var(--surface); }
.leaflet-tooltip-right::before { border-right-color: var(--surface); }
.tip { font-variant-numeric: tabular-nums; }
.tip b { display: block; }
.tip table { width: auto; }
.tip table td { padding: 1px 6px 1px 0; border: 0; }
#panel { position: fixed; z-index: 2000; left: 0; right: 0; bottom: 0; max-height: 55vh; overflow: auto;
         background: var(--surface); color: var(--ink); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px var(--shadow);
         padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); border-radius: 12px 12px 0 0; }
#panel[hidden] { display: none; }
#panel .close { float: right; margin: -6px -8px 4px 8px; min-width: 44px; min-height: 44px; font-size: 22px; line-height: 1; }
#panel .tip table td { padding: 3px 10px 3px 0; border-bottom: 1px solid var(--line); }
@media (min-width: 720px) {
  #panel { left: auto; right: 16px; bottom: 16px; width: 420px; max-height: 70vh; border: 1px solid var(--line); border-radius: 10px; }
}
/* Phones: full-width controls so the map starts higher; the table drops its least useful column. */
@media (max-width: 599px) {
  /* The whole map fits the first screen: stats go below it, labels are for screen readers only. */
  main { padding: 12px; display: flex; flex-direction: column; }
  main > .stats { order: 1; margin-top: 4px; }
  main > h2, main > .tablewrap, main > .note, main > #detail { order: 2; }
  h1 { font-size: 23px; }
  .sub { font-size: 13px; margin-bottom: 4px; }
  .views { margin-bottom: 4px; }
  .controls > label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .controls > select, .controls > input { flex: 1 1 100%; width: auto; }
  .controls > #q { flex: 1 1 38%; min-width: 0; }  /* else its 14em width forces a wrap */
  .controls > #cand { flex: 1 1 58%; }
  .legend { margin: 8px 0 12px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; width: 100%; }
  .seg button { padding: 6px 4px; font-size: 14px; line-height: 1.2; }
  .pdf { display: none; }  /* print-to-PDF is a desktop task */
  .mapwrap #map { height: 55vh; height: 55svh; min-height: 300px; }  /* beats the station page's own #map height */
  #tbl th:nth-child(2), #tbl td:nth-child(2) { display: none; }  /* Δημ. ενότητα */
  #tbl th:first-child, #tbl td:first-child { position: sticky; left: 0; background: var(--surface); }
  #tbl th:first-child { z-index: 2; }
  #tbl tbody tr:hover td:first-child, #tbl tr.sel td:first-child { background: var(--chip); }
  th, td { padding: 6px; }
}
/* Touch: 44px targets */
@media (pointer: coarse) {
  select, button, input { min-height: 44px; }
  select, input { font-size: 16px; }  /* iOS zooms into fields under 16px */
  .views a { display: inline-block; padding: 12px 0; }
  .leaflet-touch .leaflet-bar a { width: 44px; height: 44px; line-height: 44px; }
  th button { display: flex; align-items: center; min-height: 44px; width: 100%; }
  th.n button { justify-content: flex-end; }
  .rowlink { display: inline-flex; align-items: center; min-height: 44px; }
}
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
/* PDF export = the browser's print dialog ("Save as PDF"), A4 portrait. */
@page { size: A4; margin: 12mm; }
@media print {
  :root { color-scheme: light; --link: #256abf; --surface: #fff; --ink: #1d1d1b; --ink-2: #5c5b57; --line: #e4e3df; --chip: #f2f1ee; --d0: #e4e3df; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  main { max-width: none; padding: 0; }
  .seg, .pdf, .views, .leaflet-control-zoom, #panel, .hint, input, .controls label { display: none !important; }
  select { border: 0; padding: 0; appearance: none; background: none; font-weight: 600; font-size: 16px; min-height: 0; }
  #map { break-inside: avoid; }
  .tablewrap { max-height: none; overflow: visible; }
  th { position: static; }
  tr { break-inside: avoid; }
  tr.sel { box-shadow: none; background: none; }
  .rowlink { text-decoration: none; }
  th[aria-sort] button::after { content: none; }
}

  body.printing #map { width: 186mm; height: 120mm; min-height: 0; }
  @media print { #map { width: 186mm; height: 120mm; min-height: 0; } }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <nav class="views" id="views" aria-label="Άλλοι χάρτες"></nav>
  <div class="controls">
    <label for="party">Κόμμα</label>
    <select id="party"></select>
    <label for="q">Υποψήφιος</label>
    <input id="q" type="search" placeholder="Αναζήτηση ονόματος" autocomplete="off">
    <select id="cand" aria-label="Επιλογή υποψηφίου"></select>
    <div class="seg" role="group" aria-label="Μέτρο">
      <button type="button" data-m="share" aria-pressed="true">% ψήφων κόμματος</button>
      <button type="button" data-m="dev" aria-pressed="false">Απόκλιση από μέσο όρο</button>
      <button type="button" data-m="votes" aria-pressed="false">Σταυροί</button>
    </div>
    <button class="pdf" type="button" onclick="exportPdf()">Εξαγωγή PDF</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="mapwrap">
    <div id="map" role="region" aria-label="Χάρτης σταυρών ανά περιοχή"></div>
    <div class="hint" id="hint" aria-hidden="true">Χρησιμοποιήστε δύο δάχτυλα για να μετακινήσετε τον χάρτη</div>
  </div>
  <div class="legend" id="legend"></div>
  <h2>Ανά περιοχή</h2>
  <div class="tablewrap"><table id="tbl"></table></div>
  <p class="note" id="note"></p>
</main>

// Shared by template.html and stations_template.html; inlined at build time before the page script.
// The page script defines `map` and fills `layers` (index = table row data-i).
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = n => n.toLocaleString("el-GR");
const pct = x => (x * 100).toLocaleString("el-GR", {maximumFractionDigits: 1}) + "%";
const fold = s => s.normalize("NFD").replace(/\p{M}/gu, "").toUpperCase();
const HOVER = matchMedia("(hover: hover)").matches;
const TOUCH = matchMedia("(pointer: coarse)").matches;
const seq = () => ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6"].map(css);

function breaks(vals) {  // quantile breaks over the non-zero values
  const nz = vals.filter(v => v > 0).sort((a, b) => a - b);
  return nz.length ? [1, 2, 3, 4, 5].map(i => nz[Math.floor(i * nz.length / 6)]) : [];
}
function colorFor(x, br) {
  if (x <= 0) return css("--s0");
  let i = 0; while (i < br.length && x > br[i]) i++; return seq()[i];
}
function seqLegend(br, show) {
  let h = `<i style="background:${css("--s0")}"></i><span class="lbl">0</span>`;
  const edges = [0, ...br];
  seq().forEach((col, i) => {
    if (i > br.length) return;
    const lo = edges[i], hi = br[i];
    h += `<i style="background:${col}"></i><span class="lbl">${hi === undefined ? "> " + show(lo) : show(lo) + "–" + show(hi)}</span>`;
  });
  return h;
}

// Deviation = local share / overall share (1 = average). Fixed, symmetric-in-ratio steps.
const DEV_BR = [0.5, 0.75, 0.9, 1.1, 1.33, 2];
const DEV_LBL = ["< −50%", "−50 έως −25%", "−25 έως −10%", "±10%", "+10 έως +33%", "+33 έως +100%", "> +100%"];
const divSteps = () => ["--d-3", "--d-2", "--d-1", "--d0", "--d1", "--d2", "--d3"].map(css);
function devColor(r) { let i = 0; while (i < DEV_BR.length && r >= DEV_BR[i]) i++; return divSteps()[i]; }
const devFmt = r => { const d = Math.round((r - 1) * 100); return (d > 0 ? "+" : d < 0 ? "−" : "±") + Math.abs(d) + "%"; };
const devLegend = () => `<span class="lbl" style="margin-left:0">Σε σχέση με τον μέσο όρο:</span>` +
  divSteps().map((c, i) => `<i style="background:${c}"></i><span class="lbl">${DEV_LBL[i]}</span>`).join("");

// Links to the other maps of this constituency, and to the index of all maps.
$("views").innerHTML = (D.links || []).map(l => `<a href="${encodeURI(l.href)}">${l.label}</a>`).join("") +
  `<a href="index.html">Όλοι οι χάρτες</a>`;

// The first fit waits for a real container size: a page opened in a hidden tab or pane lays out at 0×0,
// where fitBounds falls back to zoom 0 (the whole world). onFit runs once, right after that fit.
function fitOnceSized(m, bounds, opts, onFit) {
  let done = false;
  const fit = () => {
    const el = m.getContainer();
    if (done || el.clientWidth < 50 || el.clientHeight < 50) return;
    done = true;
    // invalidateSize is a no-op until the map has a view, and getSize() caches the 0×0 size.
    if (m.getZoom() === undefined) m.setView([0, 0], 0, {animate: false});
    m.invalidateSize({animate: false});
    m.fitBounds(bounds(), opts);
    if (onFit) onFit();
  };
  new ResizeObserver(fit).observe(m.getContainer());
  addEventListener("resize", fit);
  document.addEventListener("visibilitychange", fit);  // hidden pages may skip ResizeObserver callbacks
  fit();
}

// Touch: one finger scrolls the page, two fingers move/zoom the map (Leaflet's pinch also pans).
function touchMap(m) {
  if (!TOUCH) return;
  m.dragging.disable();
  const hint = $("hint");
  let t;
  m.getContainer().addEventListener("touchmove", e => {
    if (e.touches.length !== 1) return hint.classList.remove("on");
    hint.classList.add("on"); clearTimeout(t); t = setTimeout(() => hint.classList.remove("on"), 1200);
  }, {passive: true});
}

// Details panel: tap/click on the map or a table row. Hover devices also get the tooltip.
const panel = document.body.appendChild(document.createElement("aside"));
panel.id = "panel"; panel.hidden = true; panel.setAttribute("aria-label", "Λεπτομέρειες");
panel.setAttribute("aria-live", "polite");
let layers = [], picked = null, opener = null;
function bindFeature(l, html) {
  l.html = html; l._b = {color: l.options.color, weight: l.options.weight};
  if (HOVER) l.bindTooltip(html, {sticky: true});
  l.on({
    mouseover: () => l !== picked && l.setStyle({color: css("--ink"), weight: 2}),
    mouseout: () => l !== picked && l.setStyle(l._b),
    click: () => pick(l),
  });
}
function pick(l, fly) {
  if (picked) picked.setStyle(picked._b);
  picked = l;
  document.querySelectorAll("tr.sel").forEach(r => r.classList.remove("sel"));
  if (!l) { const back = panel.contains(document.activeElement); panel.hidden = true; if (back) opener?.focus(); return; }
  l.setStyle({color: css("--ink"), weight: 3}); l.bringToFront();
  document.querySelector(`tr[data-i="${l.i}"]`)?.classList.add("sel");
  l.closeTooltip?.();
  panel.innerHTML = `<button type="button" class="close" aria-label="Κλείσιμο">×</button>${l.html}`;
  panel.hidden = false;
  panel.firstChild.onclick = () => pick(null);
  if (fly) {
    opener = document.activeElement;
    if (l.getLatLng) map.setView(l.getLatLng(), Math.max(map.getZoom(), 15));
    else map.fitBounds(l.getBounds(), {maxZoom: 14, padding: [24, 24]});
    $("map").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
    panel.firstChild.focus({preventScroll: true});
  }
}
function repick() { const i = picked?.i; picked = null; if (i != null && layers[i]) pick(layers[i]); else panel.hidden = true; }
addEventListener("keydown", e => e.key === "Escape" && picked && pick(null));

// Sortable table: numeric cells carry data-v. Sort state survives re-renders unless reset (tbl._sort = null).
function sortable(tbl, col, dir) {
  const st = tbl._sort ||= {col, dir};
  const ths = [...tbl.tHead.rows[0].cells];
  const apply = () => {
    ths.forEach((th, i) => i === st.col ? th.setAttribute("aria-sort", st.dir) : th.removeAttribute("aria-sort"));
    const key = r => { const td = r.cells[st.col]; return td.dataset.v != null ? +td.dataset.v : td.textContent; };
    const s = st.dir === "ascending" ? 1 : -1;
    const rows = [...tbl.tBodies[0].rows].sort((a, b) => {
      const x = key(a), y = key(b);
      return s * (typeof x === "number" ? x - y : x.localeCompare(y, "el", {numeric: true}));
    });
    tbl.tBodies[0].append(...rows);
  };
  ths.forEach((th, i) => {
    th.innerHTML = `<button type="button">${th.innerHTML}</button>`;
    th.firstChild.onclick = () => {
      st.dir = st.col === i ? (st.dir === "ascending" ? "descending" : "ascending") : th.classList.contains("n") ? "descending" : "ascending";
      st.col = i; apply();
    };
  });
  tbl.onclick = e => { const b = e.target.closest(".rowlink"); if (b) pick(layers[+b.dataset.i], true); };
  apply();
}

let metric = "share";
// Party mode (no published preference votes): one pseudo-candidate "pid:0" per party, share = party votes / valid.
const PARTY = D.mode === "party";
const T = PARTY
  ? {title: "Ψήφοι κομμάτων", num: "Ψήφοι", den: "Έγκυρα", share: "% εγκύρων", total: "ψήφοι στην περιφέρεια",
     mean: () => "μέσος όρος: % εγκύρων", rank: "Θέση κόμματος", off: "ψήφοι"}
  : {title: "Σταυροί προτίμησης", num: "Σταυροί", den: "Ψήφοι κόμματος", share: "% κόμματος", total: "σταυροί στην περιφέρεια",
     mean: party => `μέσος όρος: σταυροί / ψήφοι ${party}`, rank: "Θέση στο κόμμα", off: "σταυροί"};
const num = (p, c) => (PARTY ? p.pv[c.party] : p.cv[c.k]) || 0;
const den = (p, c) => (PARTY ? p.valid : p.pv[c.party]) || 0;
if (PARTY) {
  ["q", "cand"].forEach(id => $(id).hidden = true);
  document.querySelector('label[for="q"]').hidden = true;
  document.querySelector('[data-m="share"]').textContent = "% εγκύρων";
  document.querySelector('[data-m="votes"]').textContent = "Ψήφοι";
  $("map").setAttribute("aria-label", "Χάρτης ψήφων κόμματος ανά περιοχή");
}

$("title").textContent = `${T.title} · ${D.ep_name}`;
const MONTHS = {may: "Μαΐου", june: "Ιουνίου"};
const [yr, mo] = D.election.split("/");
$("sub").textContent = (mo === "euro" ? `Ευρωεκλογές ${yr}` : `Βουλευτικές εκλογές ${mo ? MONTHS[mo] + " " : ""}${yr}`) +
  " · ανά εκλογικό διαμέρισμα";

// Party, then candidate; the search box looks across all parties. Deep link: #party=131&cand=8.
const partySel = $("party"), sel = $("cand"), q = $("q");
const partyTotal = pid => D.cands.filter(c => c.party == pid).reduce((s, c) => s + c.total, 0);
Object.keys(D.parties).sort((a, b) => partyTotal(b) - partyTotal(a))
  .forEach(pid => partySel.append(new Option(D.parties[pid].name, pid)));
const topCand = list => list.filter(c => !c.partial).sort((a, b) => b.total - a.total)[0] || list[0];
function fillCands(keep) {
  const s = fold(q.value.trim());
  const list = D.cands.filter(c => s ? fold(c.name).includes(s) : c.party == partySel.value).sort((a, b) => b.total - a.total);
  const groups = {};
  list.forEach(c => (groups[c.party] ||= []).push(c));
  sel.innerHTML = "";
  Object.keys(groups).sort((a, b) => partyTotal(b) - partyTotal(a)).forEach(pid => {
    const g = document.createElement("optgroup");
    g.label = D.parties[pid].name;
    groups[pid].forEach(c => g.append(new Option(`${c.name} (${fmt(c.total)})${c.partial ? " · μόνο σύνολο" : ""}`, c.k)));
    sel.append(g);
  });
  if (!list.length) sel.append(new Option("Κανένα αποτέλεσμα", ""));
  sel.value = list.some(c => c.k === keep) ? keep : (topCand(list)?.k ?? "");
}
const h = new URLSearchParams(location.hash.slice(1));
const fromHash = D.cands.find(c => c.k === `${h.get("party")}:${h.get("cand")}`);
const start = fromHash || (D.parties[h.get("party")] ? topCand(D.cands.filter(c => c.party == h.get("party"))) : topCand(D.cands));
partySel.value = start.party;
fillCands(start.k);

const map = L.map("map", {scrollWheelZoom: false, zoomSnap: 0.25});  // fractional fit: whole zoom levels leave a small constituency at ~half the map
const tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '&copy; OpenStreetMap · Όρια: ΕΛΣΤΑΤ 2021 · Αποτελέσματα: ΥΠΕΣ (ανεπίσημα)', maxZoom: 18, opacity: 0.6
}).addTo(map);
touchMap(map);

const share = (p, c) => den(p, c) ? num(p, c) / den(p, c) : 0;
function value(p, c, mean) {
  if (metric === "votes") return num(p, c);
  return metric === "dev" ? (mean ? share(p, c) / mean : 0) : share(p, c);
}
function rankInParty(p, c) {  // party mode: rank among all parties
  const mine = num(p, c);
  return 1 + D.cands.filter(o => (PARTY || o.party === c.party) && num(p, o) > mine).length;
}

let layer;
function render() {
  const c = D.cands.find(x => x.k === sel.value);
  if (!c) return;
  partySel.value = c.party;
  history.replaceState(null, "", `#party=${c.party}&cand=${c.k.split(":")[1]}`);
  const feats = D.geo.features, props = feats.map(f => f.properties);
  const sumPv = props.reduce((s, p) => s + den(p, c), 0);
  const mean = sumPv ? c.mapped / sumPv : 0;
  const br = breaks(props.map(p => value(p, c, mean)));
  const fill = p => metric === "dev" ? (den(p, c) ? devColor(value(p, c, mean)) : css("--d0")) : colorFor(value(p, c, mean), br);
  const tip = p => `<div class="tip"><b>${p.name}</b><span class="m">${p.unit}</span><br>` +
    `${T.num}: <b style="display:inline">${fmt(num(p, c))}</b><br>` +
    `${T.den}: ${fmt(den(p, c))} · ${pct(share(p, c))}` +
    (den(p, c) && mean ? ` (${devFmt(share(p, c) / mean)} από τον μέσο όρο)` : "") + `<br>` +
    `${T.rank}: ${rankInParty(p, c)}η · ${p.tm} τμήμ.` +
    (p.incl.length > 1 ? `<br><span class="m">Περιλαμβάνει τα Ε.Δ.: ${p.incl.join(", ")}</span>` : "") + `</div>`;

  if (layer) layer.remove();
  layers = [];
  layer = L.geoJSON(D.geo, {
    style: f => ({fillColor: fill(f.properties), fillOpacity: 0.85, color: css("--surface"), weight: 1}),
    onEachFeature: (f, l) => { l.i = layers.length; layers.push(l); bindFeature(l, tip(f.properties)); }
  }).addTo(map);
  if (!render.fitted) { render.fitted = true; fitOnceSized(map, () => layer.getBounds()); }

  const show = v => metric === "share" ? pct(v) : fmt(Math.round(v));
  $("legend").innerHTML = metric === "dev" ? devLegend() : seqLegend(br, show);

  const party = D.parties[c.party].name;
  const best = props.slice().sort((a, b) => value(b, c, mean) - value(a, c, mean))[0];
  $("stats").innerHTML =
    `<div><b>${fmt(c.total)}</b><span>${T.total}</span></div>` +
    `<div><b>${pct(c.total ? c.mapped / c.total : 0)}</b><span>από αυτούς στον χάρτη` +
      (c.partial ? ` · το ΥΠΕΣ δίνει τους περισσότερους μόνο ως σύνολο περιφέρειας` : ``) + `</span></div>` +
    `<div><b>${pct(mean)}</b><span>${T.mean(party)}</span></div>` +
    `<div><b>${best ? best.name : "-"}</b><span>ισχυρότερη περιοχή (${metric === "votes" ? T.off : PARTY ? "% εγκύρων" : "% ψήφων " + party})</span></div>`;

  const tbl = $("tbl");
  tbl.innerHTML =
    `<thead><tr><th>Περιοχή</th><th>Δημ. ενότητα</th><th class="n">${T.num}</th><th class="n">${T.den}</th>` +
    `<th class="n">${T.share}</th><th class="n">Απόκλιση</th><th class="n">Θέση</th></tr></thead><tbody>` +
    props.map((p, i) => {
      const pv = den(p, c), r = mean ? share(p, c) / mean : 0;
      return `<tr data-i="${i}"><td><button type="button" class="rowlink" data-i="${i}">${p.name}</button></td><td>${p.unit}</td>` +
        `<td class="n" data-v="${num(p, c)}">${fmt(num(p, c))}</td><td class="n" data-v="${pv}">${fmt(pv)}</td>` +
        `<td class="n" data-v="${share(p, c)}">${pct(share(p, c))}</td><td class="n" data-v="${pv ? r : -1}">${pv && mean ? devFmt(r) : "–"}</td>` +
        `<td class="n" data-v="${rankInParty(p, c)}">${rankInParty(p, c)}</td></tr>`;
    }).join("") + `</tbody>`;
  sortable(tbl, metric === "votes" ? 2 : 4, "descending");
  repick();  // keeps the open panel on the same area, with the new numbers
}

document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  metric = b.dataset.m;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  $("tbl")._sort = null;
  render();
});
partySel.onchange = () => { q.value = ""; fillCands(); render(); };
q.oninput = () => { fillCands(sel.value); render(); };
sel.onchange = render;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);

// PDF export: refit the map to the A4 print width, wait for its tiles, then open the print dialog.
// The document title becomes the suggested file name.
let saved;
function fitForPrint() {
  const c = D.cands.find(x => x.k === sel.value);
  document.title = `${T.num} ${c.name} - ${D.ep_name} - ${D.election.replace("/", "-")}`;
  saved = saved || [map.getCenter(), map.getZoom()];
  document.body.classList.add("printing");
  map.invalidateSize();
  map.fitBounds(layer.getBounds(), {padding: [8, 8]});
}
function exportPdf() {
  fitForPrint();
  let done = false;
  const go = () => { if (!done) { done = true; window.print(); } };
  tiles.once("load", go);
  setTimeout(go, 1500);
}
addEventListener("beforeprint", fitForPrint);  // also covers Ctrl+P
addEventListener("afterprint", () => {
  document.body.classList.remove("printing");
  document.title = "Χάρτης σταυρών";
  map.invalidateSize();
  if (saved) map.setView(...saved);
  saved = null;
});

$("note").textContent =
  `Πηγή: ανεπίσημα αποτελέσματα ΥΠΕΣ ανά εκλογικό τμήμα, ενωμένα ανά εκλογικό διαμέρισμα και όρια κοινοτήτων ΕΛΣΤΑΤ 2021. ` +
  `Απόκλιση: % της περιοχής προς τον μέσο όρο του χάρτη. ` +
  `Εκτός χάρτη: ${T.off} ετεροδημοτών και ειδικών τμημάτων` +
  (D.unmatched.length ? `, και ${D.unmatched.length} διαμερίσματα χωρίς αντιστοίχιση (${D.unmatched.map(u => u.name).join(", ")}).` : ".");
render();
