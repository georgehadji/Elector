<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ΝΙΚΗ ανά διαμέρισμα</title>
<!--META-->
<link rel="stylesheet" href="vendor/leaflet-1.9.4/leaflet.min.css" integrity="sha256-tXCrvaljxgtN5LT/Syb5Mm9T+yzPFGH98JVcoJT7JTk=" crossorigin="anonymous">
<script src="vendor/leaflet-1.9.4/leaflet.min.js" integrity="sha256-XJrs/DDkVkUZ29zdzFOkGCJ9zHVo5hnpdi3c7HYJ7Uc=" crossorigin="anonymous"></script>
<!--FONTS-->
<script>/*THEME_JS*/</script>
<style>
/*THEME_TOKENS*/
/*SITE_CSS*/
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh}
body{background:var(--paper);color:var(--ink);font:1rem/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr auto}
:root{accent-color:var(--pen)}
.head{padding:var(--space-md) var(--space-md) var(--space-sm)}
.site{margin:0;padding:6px 16px 8px}
h1{margin:0 0 var(--space-2xs)}
.sub{color:var(--ink-2);font-size:1rem;margin:0}
.tabs{display:flex;gap:var(--space-xs);flex-wrap:wrap;margin-top:var(--space-sm)}
.tabs button{font:inherit;font-size:.9375rem;border:0;background:color-mix(in srgb,var(--ink) 7%,var(--paper));color:var(--ink);border-radius:999px;padding:var(--space-xs) var(--space-md);cursor:pointer;min-height:40px}
.tabs button[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}
#map{flex:1;min-height:220px}
:root[data-theme=dark] #map{background:color-mix(in srgb,var(--paper) 88%,var(--ink))}  /* Leaflet's default grey is a light slab in dark theme */
.legend{background:var(--panel);color:var(--ink);padding:8px 10px;border-radius:8px;font-size:.8125rem;line-height:1.3;box-shadow:0 1px 4px #0003;max-width:260px}
.legend b{display:block;margin-bottom:4px}
.legend,.t{overflow-wrap:anywhere}
.legend i{display:inline-block;width:14px;height:12px;margin-right:6px;vertical-align:-2px;border:1px solid #0002}
.legend .s{color:var(--ink-2)}
.leaflet-tooltip.t{font:.8125rem/1.4 "IBM Plex Sans",system-ui,sans-serif}
.leaflet-container .leaflet-tooltip.t{background:var(--panel);color:var(--ink);border-color:var(--line);box-shadow:0 1px 4px #0003;white-space:normal;width:max-content;max-width:min(460px,calc(100vw - 24px))}  /* wraps on phones instead of running off the map */
.t td+td{white-space:nowrap}  /* only the label column wraps */
.leaflet-tooltip.t::before{display:none}  /* the arrow would point at the wrong place once the tooltip is shifted into the map */
.t b{font-size:.875rem}
.t .m{color:var(--ink-2)}
.note{color:var(--ink-2);font-size:.875rem;line-height:1.4;margin:var(--space-2xs) 0 0;max-width:90ch}
.rel{font-size:.875rem;margin:var(--space-2xs) 0 0}.rel a{color:var(--link)}
@media (max-width:600px),(max-height:500px) and (orientation:landscape){  /* phone portrait and landscape */
  #map{min-height:360px;min-height:max(360px,55svh)}
  h1{font-size:1.5rem}
  .sub{font-size:.875rem}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none}
  .tipping .leaflet-control-container{opacity:.12}  /* the tooltip is wide here: dim the buttons and legend it covers */
  .leaflet-tooltip.t{font-size:.75rem;line-height:1.25;padding:4px 6px}
  .t b{font-size:.8125rem}
  .t td{padding:0 3px}
  .legend{font-size:.75rem;padding:6px 8px;max-width:200px}
  .legend i{width:11px;height:10px;margin-right:4px}
  .site{padding:2px 16px 0;font-size:.75rem;line-height:1.3}
  .site p{margin:0}
}
@media (max-height:500px) and (orientation:landscape){  /* phone landscape: the legend must not cover half the map */
  .legend{font-size:.625rem;line-height:1.2;padding:4px 6px;max-width:320px}
  .legend b{margin-bottom:2px}
  .legend i{width:9px;height:8px;margin-right:3px}
}
</style>
</head>
<body>
<!--HEADER-->
<header class="head">
  <h1>ΝΙΚΗ: ποσοστό ανά εκλογικό διαμέρισμα</h1>
  <p class="sub" id="sub"></p>
  <p class="note" id="note"></p>
  <p class="rel">Δες και: <a href="nikh_targets.html">χάρτης στόχευσης</a> · <a href="NIKH_eklegmenoi_2023.html">αναφορά Μαΐου–Ιουνίου</a></p>
  <div class="tabs" id="tabs" role="group" aria-label="Εκλογή"></div>
</header>
<main id="map" aria-label="Χάρτης"></main>
<!--FOOTER-->
<script>
const D = /*DATA*/null;
const BINS = [0, 1, 2, 3, 4, 5, 6, 8, 10];  // % of valid votes
const COLORS = ["#f3eef8", "#e0d3ec", "#cbb5de", "#b497cf", "#9c78bf", "#845bae", "#6b3f9a", "#532a82", "#3a1866"];
// change views: key -> [from, to, button label, period label, bins?]; colour = change in percentage points
const DELTAS = {
  "d-may-june": ["2023-may", "2023-june", "Μεταβολή Μάιος → Ιούνιος", "Μάιος → Ιούνιος 2023"],
  "d-june-euro": ["2023-june", "2024-euro", "Μεταβολή Ιούνιος → Ευρωεκλογές", "Ιούνιος 2023 → Ευρωεκλογές 2024"],
  "d-may-euro": ["2023-may", "2024-euro", "Μεταβολή Μάιος → Ευρωεκλογές", "Μάιος 2023 → Ευρωεκλογές 2024"],
};
const DBINS = [-Infinity, -2, -1, -0.25, 0.25, 1, 2, 4];
const DBINS_WIDE = [-Infinity, -4, -2, -0.5, 0.5, 3, 6, 9];  // bloc changes are mostly +2..+10
DELTAS["d-bloc-may"] = ["b2019", "b2023-may", "Μεταβολή χώρου 2019 → Μάιος 2023", "Χώρος 2019 → Μάιος 2023", DBINS];
DELTAS["d-bloc"] = ["b2019", "b2023-june", "Μεταβολή χώρου 2019 → Ιούνιος 2023", "Χώρος 2019 → Ιούνιος 2023", DBINS_WIDE];
DELTAS["d-bloc-euro"] = ["b2019", "b2024-euro", "Μεταβολή χώρου 2019 → Ευρωεκλογές", "Χώρος 2019 → Ευρωεκλογές 2024",
                         [-Infinity, -4, -2, -0.5, 0.5, 5, 10, 15]];  // mostly +2..+18
const EURO_NOTE = "Οι ευρωεκλογές είχαν πολύ χαμηλότερη συμμετοχή και ενιαία εθνική λίστα· η άνοδος του ποσοστού δεν σημαίνει περισσότερους ψηφοφόρους. ";
const DELTA_NOTE = {"d-june-euro": EURO_NOTE, "d-may-euro": EURO_NOTE,
  "d-bloc-may": "Η ΝΙΚΗ δεν κατέβηκε το 2019, γι' αυτό συγκρίνεται ο «χώρος»: 2019 Ελληνική Λύση + Χρυσή Αυγή + Ένωση Κεντρώων, " +
            "Μάιος 2023 ΝΙΚΗ + Ελληνική Λύση (οι Σπαρτιάτες δεν κατέβηκαν τον Μάιο). Τα κόμματα δεν είναι ίδια, άρα η μεταβολή δεν δείχνει μετακίνηση ψηφοφόρων. ",
  "d-bloc": "Η ΝΙΚΗ δεν κατέβηκε το 2019, γι' αυτό συγκρίνεται ο «χώρος»: 2019 Ελληνική Λύση + Χρυσή Αυγή + Ένωση Κεντρώων, " +
            "Ιούνιος 2023 ΝΙΚΗ + Ελληνική Λύση + Σπαρτιάτες. Τα κόμματα δεν είναι ίδια, άρα η μεταβολή δεν δείχνει μετακίνηση ψηφοφόρων. ",
  "d-bloc-euro": "Η ΝΙΚΗ δεν κατέβηκε το 2019, γι' αυτό συγκρίνεται ο «χώρος»: 2019 Ελληνική Λύση + Χρυσή Αυγή + Ένωση Κεντρώων, " +
            "ευρωεκλογές 2024 ΝΙΚΗ + Ελληνική Λύση + Φωνή Λογικής. Τα κόμματα δεν είναι ίδια, άρα η μεταβολή δεν δείχνει μετακίνηση ψηφοφόρων. " +
            "Οι ευρωεκλογές είχαν πολύ χαμηλότερη συμμετοχή και ενιαία εθνική λίστα, κάτι που ανεβάζει τα ποσοστά των μικρότερων κομμάτων. "};
const dbins = k => DELTAS[k][4] || DBINS;
const DCOLORS = ["#b35806", "#e08214", "#fdb863", "#f2f0ee", "#d8daeb", "#b2abd2", "#8073ac", "#542788"];
const bin = (p, bins, colors) => { let i = 0; while (i + 1 < bins.length && p >= bins[i + 1]) i++; return colors[i]; };
const color = p => bin(p, BINS, COLORS);
const share = v => v && v[1] ? 100 * v[0] / v[1] : null;
const signed = (d, digits = 1) => (d > 0 ? "+" : d < 0 ? "−" : "±") +
  Math.abs(d).toLocaleString("el-GR", {minimumFractionDigits: digits, maximumFractionDigits: digits});
const fmt = n => n.toLocaleString("el-GR");
const pctf = p => p.toLocaleString("el-GR", {minimumFractionDigits: 1, maximumFractionDigits: 1}) + "%";

let current = Object.keys(D.elections)[1];
const map = L.map("map", {preferCanvas: true, zoomSnap: 0.25}).setView([38.6, 23.8], 6.5);
map.attributionControl.addAttribution("Όρια: ΕΛΣΤΑΤ 2021 · Αποτελέσματα: ΥΠΕΣ (ανεπίσημα)");  // no base map: the choropleth is the only colour

function style(f) {
  if (DELTAS[current]) {
    const [from, to] = DELTAS[current], a = f.properties[from], b = f.properties[to];
    if (share(a) === null || share(b) === null) return {weight: 0.3, color: "#888", fillColor: "#ccc", fillOpacity: 0.25};
    return {weight: 0.3, color: "#5553", fillColor: bin(share(b) - share(a), dbins(current), DCOLORS),
            fillOpacity: Math.min(a[1], b[1]) < 50 ? 0.45 : 0.85};
  }
  const v = f.properties[current];
  if (!v || !v[1]) return {weight: 0.3, color: "#888", fillColor: "#ccc", fillOpacity: 0.25};
  const p = 100 * v[0] / v[1];
  return {weight: 0.3, color: "#5553", fillColor: color(p), fillOpacity: v[1] < 50 ? 0.45 : 0.85};
}
function tip(f) {
  const a = f.properties, rows = Object.entries({...D.elections, ...D.blocs}).map(([k, name]) => {
    const v = a[k]; if (!v || !v[1]) return `<tr><td>${name}</td><td colspan=2>—</td></tr>`;
    const s = k === current ? "font-weight:600" : "";
    return `<tr style="${s}"><td>${name}</td><td style="text-align:right">${pctf(100 * v[0] / v[1])}</td>` +
           `<td class="m" style="text-align:right">${fmt(v[0])}/${fmt(v[1])}</td></tr>`;
  }).join("");
  const d = Object.entries(DELTAS).map(([k, [from, to, , label]]) => {
    const p0 = share(a[from]), p1 = share(a[to]);
    if (p0 === null || p1 === null) return "";
    return `<tr style="${current === k ? "font-weight:600" : ""}"><td>${label}</td>` +
      `<td style="text-align:right">${signed(p1 - p0)} μον.</td>` +
      `<td class="m" style="text-align:right">${signed(a[to][0] - a[from][0], 0)} ψήφοι</td></tr>`;
  }).join("");
  return `<b>${a.n}</b><div class="m">${a.u} · ${a.ep}</div><table>${rows}${d}</table>`;
}
map.on("tooltipopen", () => map.getContainer().classList.add("tipping"));
map.on("tooltipclose", () => map.getContainer().classList.remove("tipping"));
const layer = L.geoJSON(D.geo, {style, onEachFeature: (f, l) => {
  l.bindTooltip(() => tip(f), {sticky: true, className: "t"});
  l.on("click", () => l.openTooltip());
  l.on("mousemove", e => {  // keep the tooltip inside the map: it is placed beside the cursor, so shift it sideways and up/down (one event behind)
    const t = l.getTooltip(), el = t && t.getElement();
    if (!el) return;
    const w = el.offsetWidth, h = el.offsetHeight, {x, y} = e.containerPoint, size = map.getSize();
    const left = el.classList.contains("leaflet-tooltip-left");
    const base = left ? x - 6 - w : x + 6;  // where Leaflet puts the left edge without an offset
    const dx = Math.min(Math.max(base, 4), Math.max(4, size.x - 4 - w)) - base;
    const dy = Math.max(4 - (y - h / 2), Math.min(0, size.y - 4 - (y + h / 2)));
    const o = L.point(t.options.offset), ox = left ? -dx : dx;  // for the left side Leaflet applies the x offset reversed
    if (Math.abs(ox - o.x) > 0.5 || Math.abs(dy - o.y) > 0.5) { t.options.offset = L.point(ox, dy); t.update(); }
  });
}}).addTo(map);

const legend = L.control({position: "bottomright"});
legend.onAdd = () => L.DomUtil.create("div", "legend");
legend.addTo(map);
const n = x => x.toLocaleString("el-GR");
function drawLegend() {
  const delta = Boolean(DELTAS[current]), bins = delta ? dbins(current) : BINS, colors = delta ? DCOLORS : COLORS;
  legend.getContainer().innerHTML = `<b>${delta ? "Μεταβολή (μον.)" : "% εγκύρων"}</b>` + bins.map((b, i) => {
    const label = b === -Infinity ? `&lt; ${n(bins[1])}` : i + 1 < bins.length ? `${n(b)} έως ${n(bins[i + 1])}` : `≥ ${n(b)}`;
    return `<div><i style="background:${colors[i]}"></i>${label}</div>`;
  }).join("") + `<div style="margin-top:4px;color:var(--ink-2)">αχνό: &lt; 50 έγκυρα</div>`;
}

const NOTE = "Ανεπίσημα αποτελέσματα ΥΠΕΣ, κανονικά τμήματα· διαμερίσματα που δεν αντιστοιχίστηκαν σε κοινότητα ΕΛΣΤΑΤ λείπουν.";
function setElection(k) {
  current = k;
  const t = D.totals[k];
  if (DELTAS[k]) {
    const [from, to, , label] = DELTAS[k];
    const a = D.totals[from], b = D.totals[to], pa = 100 * a.votes / a.valid, pb = 100 * b.votes / b.valid;
    document.getElementById("sub").textContent =
      `${label}: ${pctf(pa)} → ${pctf(pb)} (${signed(pb - pa)} μονάδες, ${signed(b.votes - a.votes, 0)} ψήφοι).`;
    document.getElementById("note").textContent =
      "Χρώμα = διαφορά ποσοστού σε ποσοστιαίες μονάδες. " + (DELTA_NOTE[k] || "") + NOTE;
  } else {
    document.getElementById("sub").textContent =
      `${D.elections[k]}: ${pctf(100 * t.votes / t.valid)} στα διαμερίσματα του χάρτη (${fmt(t.votes)} ψήφοι, ${fmt(t.areas)} περιοχές).`;
    document.getElementById("note").textContent = NOTE;
  }
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k));
  layer.setStyle(style);
  drawLegend();
}
for (const [k, name] of [...Object.entries(D.elections), ...Object.entries(DELTAS).map(([k, v]) => [k, v[2]])]) {
  const b = document.createElement("button");
  b.textContent = name; b.dataset.k = k; b.onclick = () => setElection(k);
  document.getElementById("tabs").append(b);
}
setElection(current);
// Pages opened in hidden panes lay out at 0x0, and map.getSize() caches that size: fit once the container
// has a real width (hidden pages may skip ResizeObserver callbacks, hence also visibilitychange).
let fitted = false;
const fitOnce = () => {
  if (fitted || !map.getContainer().clientWidth) return;
  fitted = true;
  map.invalidateSize({animate: false});
  map.fitBounds(layer.getBounds());
};
new ResizeObserver(fitOnce).observe(map.getContainer());
document.addEventListener("visibilitychange", fitOnce);
fitOnce();
</script>
</body>
</html>
