<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<!--META-->
<!--FONTS-->
<script>/*THEME_JS*/</script>
<style>
/*THEME_TOKENS*/
/*SITE_CSS*/
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
:root{/* taste-skill-ignore: the hatch is a data colour (the ninth party with seats) */--hatch:repeating-linear-gradient(135deg,var(--mute) 0 3px,var(--ink-2) 3px 4.5px)}
main{max-width:var(--page);margin:0 auto;padding:var(--space-lg) var(--space-md) 0}
h1{margin:var(--space-md) 0 var(--space-md)}
h2{margin:var(--space-2xl) 0 var(--space-sm)}
h3{margin:var(--space-lg) 0 var(--space-xs)}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 32px;margin:28px 0 20px}
.hero p{margin:0}
.hero b{display:block;font-size:clamp(2.75rem,1.6rem + 4.6vw,4.5rem);font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .t{display:flex;flex-direction:column;margin-top:8px}
.hero strong{font-weight:600}
.hero small{font-weight:400;font-size:.875rem;color:var(--ink-2)}
@media (max-width:600px){.hero{grid-template-columns:1fr;gap:14px}.hero p{display:flex;align-items:baseline;gap:14px}
  .hero b{flex:0 0 3.1em}.hero .t{margin:0}}
.lead{font-size:1.25rem;line-height:1.45;margin:0 0 8px;max-width:60ch}
.note{color:var(--ink-2);font-size:1.125rem;margin:2px 0 8px;max-width:68ch}
.when{display:flex;flex-wrap:wrap;align-items:center;gap:0 18px;margin:16px 0 0;padding:0 12px;border:0;
  position:sticky;top:0;z-index:3;background:var(--wash)}
.when legend{float:left;padding:0;margin-right:6px;font-weight:600}
.when{position:sticky;gap:0 8px}
.when label{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;margin:2px 0;font-weight:600;cursor:pointer;border:2px solid color-mix(in srgb,var(--ink) 40%,transparent);border-radius:999px;transition:background-color 150ms ease-out,border-color 150ms ease-out}
.when label:hover{border-color:var(--ink)}
.when input{position:absolute;opacity:0;pointer-events:none}
.when label:has(input:checked){background:var(--ink);border-color:var(--ink);color:var(--paper)}
.when label:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
main:has(#h180:checked) .h0,main:has(#h0:checked) .h180{display:none}
.odds{margin:12px 0 0;padding:0;list-style:none}
.odds li{display:grid;grid-template-columns:minmax(14em,19em) 1fr 4.5em;gap:0 14px;align-items:center;padding:10px 0}
.odds .lb{display:flex;flex-direction:column}
.odds small{font-size:.875rem;color:var(--ink-2)}
.odds b{font-size:1.25rem;text-align:right;font-variant-numeric:tabular-nums}
.odds .nd .lb{font-weight:600}
.odds .far .lb,.odds .far b{color:var(--ink-2)}
.odds .far b{font-size:1rem}
.odds .far .seatbar span:not(.rest){opacity:.45}
@media (max-width:600px){.odds li{grid-template-columns:1fr auto;gap:6px 12px}.odds .seatbar{grid-column:1/-1;grid-row:2}}
.sh{display:grid;grid-template-columns:minmax(7.5em,11em) 1fr 4.6em 6em;gap:0 10px;align-items:center;margin:8px 0 0;font-variant-numeric:tabular-nums}
.sh>span{font-size:.875rem}
.sh .hd{font-size:.875rem;color:var(--ink-2);text-align:right}
.sh .hd.l{text-align:left}
.sh .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh .v{text-align:right}
.sh .v small{display:block;font-size:.875rem;color:var(--ink-2)}
.trk{position:relative;height:24px}
.trk.ax{height:20px;font-size:.875rem;color:var(--ink-2)}
.trk.ax span{position:absolute;transform:translateX(-50%)}
.sh .trk.ax{margin:4px 0 6px}
.trk .rng{position:absolute;top:10px;height:4px;border-radius:2px;background:var(--c);opacity:.5}
.trk .dot{position:absolute;top:6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--paper)} /* taste-skill-ignore: a ring that keeps the dot apart from its range, not a shadow */
.trk .gl{position:absolute;top:5px;bottom:5px;border-left:1px solid var(--line)} /* taste-skill-ignore: chart scale and the 3% threshold, data not dividers */
.trk .thr{position:absolute;top:0;bottom:0;border-left:1px dashed var(--ink-2)} /* taste-skill-ignore: chart scale and the 3% threshold, data not dividers */
.seatbar{display:flex;gap:2px;height:34px;margin:16px 0 0;position:relative}
.seatbar span{display:block;height:100%;background:var(--c)}
.seatbar span:first-child{border-radius:4px 0 0 4px}
.seatbar span:nth-last-child(2){border-radius:0 4px 4px 0}
.seatbar i{position:absolute;left:calc(50.33% - 1px);top:-8px;bottom:-8px;border-left:2px solid var(--ink)}
.seatbar .rest{background:var(--wash)}
.seatbar+.trk.ax{margin-top:10px}
.seatbar.mini{height:14px;margin:0}
.seatbar.mini i{top:-4px;bottom:-4px}
.legend{display:flex;flex-wrap:wrap;gap:2px 16px;margin:8px 0 0;padding:0;list-style:none;font-size:.875rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.legend b{font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
h3.sub{margin-top:24px}
.pl{list-style:none;padding:0;margin:4px 0 0}
.pl li{display:flex;align-items:center;gap:6px;padding:4px 0;max-width:22em}
.pl b{margin-left:auto;font-variant-numeric:tabular-nums}
.pl.wide-pl li{max-width:26em}
.hero.duo{grid-template-columns:repeat(2,minmax(0,16em));margin:16px 0 8px}
.hero.duo b{font-size:clamp(2rem,1.4rem + 2.4vw,3rem)}
.ladder li{grid-template-columns:minmax(14em,19em) 1fr}
@media (max-width:600px){.ladder li{grid-template-columns:1fr}.hero.duo{grid-template-columns:1fr}}
figure{margin:8px 0 0}
figure svg{display:block;width:100%;height:auto;overflow:visible}
figcaption{color:var(--ink-2);font-size:1.0625rem;margin-top:2px}
.narrow{display:none}
@media (max-width:600px){.wide{display:none}.narrow{display:block}
  .sh{grid-template-columns:1fr 4.8em 5.4em;grid-auto-flow:row dense;gap:0 8px}
  .sh .trk{grid-column:1/-1;margin-bottom:6px}.sh .tk{display:none}}
.grid{stroke:var(--line);stroke-width:1}
.base{stroke:var(--ink-2);stroke-width:1}
.ax-l{fill:var(--ink-2)}
.bar{fill:var(--mute)}
.bar.win{fill:var(--ink-2)}
.bar:hover{opacity:.7}
.m151{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}
.m151-l{fill:var(--ink);font-weight:600}
.wrap{overflow-x:auto}
.wrap>table{width:100%}
td small{font-size:inherit;color:var(--ink-2)}
@media (max-width:600px){td small{display:block}}
.swipe{display:none}
@media (max-width:600px){.swipe{display:inline}}
details .wrap{max-height:75vh;overflow:auto}
details thead th{position:sticky;top:0;z-index:1;background:var(--paper)}
details thead th:first-child{z-index:2}
table{border-collapse:collapse;margin-top:8px;font-size:.875rem;font-variant-numeric:tabular-nums}
th,td{padding:3px 12px 3px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:bottom}
th{font-weight:600;color:var(--ink-2);font-size:.875rem}
tbody th{font-weight:400;color:var(--ink);font-size:inherit}  /* row headers read like the cells beside them */
td.n,th.n{text-align:right}
.wrap td{white-space:nowrap}
.wrap tr>:first-child{position:sticky;left:0;background:var(--paper);padding-left:0}
@media (max-width:600px){.wrap td:first-child{white-space:normal;min-width:6.5em;max-width:8.5em}.pf{display:none}}
.method small{font-size:.875rem}
.rel a{padding:12px 0}
td.z{color:var(--ink-2)}
tr.state td{font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:5px}
.method p{max-width:66ch;margin:6px 0}
.rel{font-size:1.0625rem;margin:18px 0 0;color:var(--ink-2)}
a{color:var(--pen)}
.pick{display:flex;flex-wrap:wrap;gap:0 14px;margin:8px 0 0;padding:0;border:0;font-size:.875rem}
.pick legend{float:left;padding:0;margin-right:4px;font-weight:600;line-height:44px}
.pick label{display:inline-flex;align-items:center;gap:6px;min-height:44px;cursor:pointer}
.pick input{margin:0;accent-color:var(--pen)}
.pick i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c)}
.epmap{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-start}
.epmap figure{margin:8px 0 0}
.epmap figure:first-child{flex:1 1 420px;max-width:520px}
.epmap figure:last-child{flex:0 1 260px}
.epmap .epd{order:3;flex:1 1 100%}
@media (max-width:600px){.epmap .epd{order:0}}
.epmap svg{display:block;width:100%;height:auto;overflow:hidden}
.epmap path{fill:var(--wash);stroke:var(--line);stroke-width:.7;stroke-linejoin:round;cursor:pointer;outline:none}
.epmap path.none{cursor:default}
.epmap path:hover,.epmap path:focus-visible{stroke:var(--ink-2);stroke-width:1.2}
.epmap path.on{stroke:var(--ink);stroke-width:1.6}
/*MAP_CSS*/
.legend-t{margin:8px 0 0;font-size:.875rem;font-weight:600}
.legend.bins{--c:var(--ink-2);margin-top:2px}
.legend.bins i{border-radius:2px;outline:1px solid var(--line);outline-offset:-1px}
.epsel{margin:8px 0 0;font-size:.875rem}
.epsel label{font-weight:600}
.epsel select{min-height:44px;max-width:100%;font:inherit;color:var(--ink);background:var(--paper);border-radius:6px;padding:0 8px}
.legend.bins i.z{background:var(--wash)}
.epd{max-width:68ch}
.toss5{margin:4px 0 0;padding-left:1.4em;max-width:68ch}
.toss5 li{margin:4px 0}
.wrap td.bt{white-space:normal;min-width:16em}
.wrap tr:has(.bt) td{vertical-align:top}
.bt span{white-space:nowrap}
.epd p{margin:8px 0 0}
.epd p:first-child{min-height:3em}
/* Chapters: each question has its own field of colour, a tone step of one hue over the page ground. Inside a field --paper and --wash
   are the field's own, so every sticky cell, ring and fill that uses them matches. The bar of chapters sticks under the horizon bar. */
:root{--base:var(--paper)}
.ch{--chroma:.12;--paper:color-mix(in oklab,oklch(.66 var(--chroma) var(--hue)) 14%,var(--base));--wash:color-mix(in srgb,var(--ink) 8%,var(--paper));
  margin:var(--space-2xl) calc(50% - 50vw) 0;padding:var(--space-2xl) max(var(--space-md),calc(50vw - var(--page) / 2 + var(--space-md))) var(--space-xl);
  background:var(--paper);scroll-margin-top:96px}
.ch+.ch{margin-top:0}
.ch h2:first-child{margin-top:0}
.ch.quiet{--chroma:.02}
.pick.chips{gap:6px;position:relative}
.pick.chips input{position:absolute;opacity:0;pointer-events:none}
.pick.chips label{justify-content:center;min-width:48px;padding:0 14px;border-radius:999px;background:var(--wash);font-weight:600;font-variant-numeric:tabular-nums;transition:background-color 150ms ease-out,color 150ms ease-out}
.pick.chips label:hover{background:color-mix(in srgb,var(--ink) 14%,var(--paper))}
.pick.chips label,.chap a{transition-property:background-color,color,transform;transition-duration:100ms;transition-timing-function:ease-out}
.pick.chips label:active,.chap a:active{transform:scale(.97)}
.fr li:not(.ax):hover .tk{background-color:color-mix(in srgb,var(--ink) 6%,transparent)}
@keyframes slin{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:no-preference){.slv{animation:slin 150ms ease-out}}
.pick.chips label:has(input:checked){background:var(--ink);color:var(--paper)}
.pick.chips label:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.po{margin:12px 0 0;padding:0;list-style:none}
.po li{display:grid;grid-template-columns:minmax(14em,19em) 1fr 4.5em;gap:0 14px;align-items:center;padding:8px 0}
.po .lb{display:flex;flex-direction:column}
.po small{font-size:.875rem;color:var(--ink-2)}
.po b{font-size:1.25rem;text-align:right;font-variant-numeric:tabular-nums}
.pb{position:relative;height:14px;border-radius:7px;background:var(--wash)}
.pb i{position:absolute;inset:0 auto 0 0;border-radius:7px;background:oklch(.55 .15 var(--hue));min-width:2px}
.pb em{position:absolute;top:-5px;bottom:-5px;border-left:2px solid var(--ink)}
@media (max-width:600px){.po li{grid-template-columns:1fr auto;gap:6px 12px}.po .pb{grid-column:1/-1;grid-row:2}}
@media (prefers-reduced-motion:reduce){.pick.chips label{transition:none}}
.frec{margin:16px 0 8px}
.fl{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.875rem;color:var(--ink-2)}
.fl span{display:inline-flex;align-items:center;gap:6px}
.fr{list-style:none;margin:12px 0 0;padding:0}
.fr li{display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:0 14px;align-items:center;min-height:30px;font-size:.9375rem}
.fr .tk{position:relative;height:30px;border-right:1px solid var(--line);background:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px 25%)}
.fr .ax{min-height:24px}.fr .ax .tk{height:24px;background:none;border:0}
.fr .ax .tk span{position:absolute;top:2px;transform:translateX(-50%);font-size:.875rem;color:var(--ink-2)}
.d{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.fr .d{position:absolute;top:50%;margin:-6px 0 0 -6px;box-shadow:0 0 0 2px var(--paper)}
.e19{--c:oklch(.58 .16 255)}.e23m{--c:oklch(.66 .17 45)}.e23j{--c:oklch(.62 .13 165)}
.fr .rg{position:absolute;top:50%;height:2px;margin-top:-1px;background:var(--mute)}
.m{display:inline-block;width:9px;height:9px;border:2px solid var(--ink);transform:rotate(45deg)}
.fr .m{position:absolute;top:50%;margin:-5.5px 0 0 -5.5px}
.bn{display:inline-block;width:0;height:14px;border-left:1px dashed var(--ink-2)}
.fr .bn{position:absolute;top:0;bottom:0;height:auto}
@media (max-width:600px){.fr li{grid-template-columns:1fr;gap:0}.fr .ax .lb{display:none}}
.chap{position:sticky;top:44px;z-index:3;display:flex;gap:0 22px;overflow-x:auto;margin:0;padding:0 12px;background:var(--wash);scrollbar-width:none}
.chap a{display:inline-flex;align-items:center;gap:8px;min-height:44px;white-space:nowrap;color:var(--ink-2);font-weight:600;text-decoration:none}
.chap a::before{content:"";width:10px;height:10px;border-radius:50%;background:oklch(.62 .14 var(--hue))}
.chap a:hover{color:var(--ink)}
.chap a[aria-current]{color:var(--paper);background:var(--ink);text-decoration:none;border-radius:999px;padding:0 12px;margin:4px 0;min-height:36px}
.chap a:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
</style>

<body>
<!--HEADER-->
<main id="main">
  <h1><!--H1--></h1>
  <!--WHEN-->
  <!--LEAD-->
  <p class="note">Οι αριθμοί είναι συχνότητες σε <!--N--> εκλογές που προσομοιώσαμε από τον μέσο όρο των δημοσκοπήσεων, με τον εκλογικό νόμο των εκλογών του Ιουνίου 2023. Δημοσκοπήσεις έως <!--ASOF-->. Ανεπίσημο.</p>
  <!--H180NOTE-->
  <!--CHAPNAV-->
  <!--BODY-->
  <p class="rel"><!--SOURCES--></p>
</main>
<!--FOOTER-->
<script>/*SHARED_JS*/</script>
<script>
// The view lives in the address, so a shared link opens it again: #180 (in six months), p=<party on the map>,
// ep=<constituency>, sam=<level of the Samaras scenario>, joined by "&" (#180&p=ELAS&ep=45).
const h0 = document.getElementById("h0"), h180 = document.getElementById("h180");  // both exist on every page; the pair is hidden on the scenarios page
const parties = [...document.querySelectorAll('input[name="m"]')];
const sel = document.getElementById("ep");
const sams = [...document.querySelectorAll('input[name="sam"]')];
// Map: a tap or focus on a constituency shows its seats for the horizon on screen.
let on = null;
// The constituency is marked in both figures (Attica is in each); on a phone the answer sits right under the map.
const epd = document.querySelector(".epd p"), hint = epd && epd.textContent;
const views = [...document.querySelectorAll("a[data-view]")];  // links to the other pages carry the view
const save = () => {
  const p = parties.find((r) => r.checked);
  const sm = sams.find((r) => r.checked);
  const s = [h180.checked && "180", p && p !== parties[0] && "p=" + p.id.slice(2), on && "ep=" + on.dataset.ep,
    sm && !sm.defaultChecked && "sam=" + sm.id.slice(4)]
    .filter(Boolean).join("&");
  history.replaceState(null, "", s ? "#" + s : location.pathname + location.search);
  for (const a of views) a.hash = s && s.replace(/&?(p|ep)=[^&]*/g, "").replace(/^&/, "");
};
const show = (el) => {
  for (const x of document.querySelectorAll(".epmap path.on")) x.classList.remove("on");
  on = el;
  if (!epd) return;  // the page without the map
  if (!el) { epd.textContent = hint; sel.value = ""; return; }
  for (const x of document.querySelectorAll(`.epmap path[data-ep="${el.dataset.ep}"]`)) x.classList.add("on");
  epd.textContent = el.dataset[h180.checked ? "d180" : "d0"];
  sel.value = el.dataset.ep;
};
const path = (ep) => document.querySelector(`.epmap path[data-ep="${CSS.escape(ep)}"]`);
for (const t of location.hash.slice(1).split("&")) {
  if (t === "180") h180.checked = true;
  else if (t.startsWith("p=")) { const r = document.getElementById("m-" + t.slice(2)); if (r) r.checked = true; }
  else if (t.startsWith("ep=") && path(t.slice(3))) show(path(t.slice(3)));
  else if (t.startsWith("sam=")) { const r = document.getElementById("sam-" + t.slice(4)); if (r) r.checked = true; }
}
for (const el of document.querySelectorAll(".epmap path[data-ep]")) {
  el.addEventListener("click", () => { show(el); save(); epd.scrollIntoView({block: "nearest"}); });
  el.addEventListener("focus", () => { show(el); save(); });
}
if (sel) sel.addEventListener("change", () => { show(sel.value ? path(sel.value) : null); save(); });
for (const r of [h0, h180]) r.addEventListener("change", () => { if (on) show(on); save(); });
for (const r of [...parties, ...sams]) r.addEventListener("change", save);
const chaps = [...document.querySelectorAll(".ch")], links = [...document.querySelectorAll(".chap a")];
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver((es) => {
    for (const e of es) if (e.isIntersecting) for (const a of links) {
      if (a.hash === "#" + e.target.id) {
        a.setAttribute("aria-current", "true");
        const bar = a.parentNode;  // keep the current chapter in view on a narrow screen
        bar.scrollLeft = a.offsetLeft - (bar.clientWidth - a.offsetWidth) / 2;
      } else a.removeAttribute("aria-current");
    }
  }, {rootMargin: "-45% 0px -50% 0px"});
  for (const c of chaps) io.observe(c);
}
</script>
</body>
</html>
